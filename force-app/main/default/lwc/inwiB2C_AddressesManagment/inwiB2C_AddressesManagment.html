    <div class="slds-grid slds-wrap slds-grid_vertical-stretch">

        <lightning-combobox placeholder="Pays" onchange={ChangePays} data-theid="Pays" label="Pays" required
            value={valuePays} class="slds-col slds-size_1-of-2 elementMargin2" options={PaysValues} >
        </lightning-combobox>
        <!--
        <lightning-combobox placeholder="sélectionnez un pays" onchange={ChangeRegion} data-theid="Region"
            label="Region" required class="slds-col slds-size_1-of-2 elementMargin2" options={RegionValues}>
        </lightning-combobox>

        <lightning-input type="text" disabled data-theid="Region" label="Region" value={r}
            placeholder="sélectionnez une ville" class="slds-col slds-size_1-of-2 elementMargin2">
        </lightning-input>


    </div>


    <div class="slds-grid slds-wrap slds-grid_vertical-stretch">

        <lightning-combobox placeholder="sélectionnez une ville" onchange={ChangeVille} data-theid="Ville" value={v}
            label="Ville" required class="slds-col slds-size_1-of-2 elementMargin2" options={VilleValues} >
        </lightning-combobox>

        <template if:false={isToSpecify}>
            <lightning-combobox placeholder="sélectionnez une ville" onchange={ChangeQuartier} data-theid="Quartier"
                value={q} label="Quartier" required  class="slds-col slds-size_1-of-2 elementMargin2" options={QuartierValues} >
            </lightning-combobox>
        </template>

        <template if:true={isToSpecify}>
            <lightning-input type="text" onchange={ChangePrecisionQuartier} data-theid="PrecisionQuartier"
                label="Précision Quartier" placeholder="Précisez le quartier" value={pq}
                class="slds-col slds-size_1-of-2 elementMargin2" >
            </lightning-input>

        </template>


    </div>
