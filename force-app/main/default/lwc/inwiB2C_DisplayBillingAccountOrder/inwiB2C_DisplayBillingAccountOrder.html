<template>
    <template if:false={loading}>
    
      <template if:true={haserror}>
        <div style="color: red">{errormessage}</div>
    
    </template>
    <div class="tableCss" style="height: 300px;">
        <lightning-datatable
                key-field="index"
                data={records}
                columns={columns}
                max-row-selection="1"
                onrowselection={getSelectedName}
                
                selected-rows={preSelectedRows}
               
                >
        </lightning-datatable>
    </div> 
    
    <div style="position: relative;padding:20px;">
      <!-- CHB 08/05/2024 ano B-15948<lightning-button  label="Précedent" onclick={gotopreviousStep}  class="slds-float_right" 
      style=" position: absolute;  right: 90px; "></lightning-button>-->
      <lightning-button label="Suivant" variant="brand" onclick={next} class="slds-float_right"    style=" position: absolute; right: 10px; "></lightning-button>
  </div>
  </template>



</template>
