<template>
    <div class="slds-p-right_small slds-m-bottom_xx-small slds-show_inline-block slds-size_12-of-12 slds-medium-size_12-of-12">
        <lightning-card title="Commandes">
            <lightning-button-icon icon-name="utility:refresh" slot="actions" alternative-text="Rafraîchir la liste" title="Rafraîchir" onclick={refreshData}></lightning-button-icon>
            <lightning-datatable
                class="tab-style slds-table slds-table_bordered slds-table_col-bordered"
                key-field="Id"
                columns={columns}
                data={records}
                onrowaction={handleRowAction}
                sorted-by={sortedBy}
                sorted-direction={sortedDirection}
                onsort={handleSort}
                hide-checkbox-column="true">
            </lightning-datatable>
        </lightning-card>
    </div>
</template>
