    </div>

        <lightning-input type="number" onchange={handleContactChange} data-theid="ContactNumber"

        </lightning-input>
    </div>

    <br>
    <lightning-button variant="brand" label="Recherche" data-theid="searche" 
        title="Recherche" onclick={handleSearch} 
        class="slds-m-left_x-small" style="display:none">
